# A12 Position Guard configuration (Phase 5, verdict-only).
model:
  backend: llamacpp            # llamacpp | stub
  endpoint: "http://127.0.0.1:8081"   # Analyst slot (shared with A2/A3/A13)
  model_id: "qwen3.8-27b-q5_k_m"   # v0.14.9: corrected, :8081 has served 3.8 since 08-22
  temperature: 0.0
  max_tokens: 700              # verdicts are small; keeps slot contention low
  timeout_secs: 120
  retries_on_invalid: 1
  disable_thinking: true       # v0.14.5 — same 27B hybrid-model thinking-leak bug as
                               # A2 (see config/a2.yaml). The guard's "is the
                               # thesis broken NOW" verdict is JSON; without this
                               # it can dissolve into prose and fail closed.

guard:
  # Items older than this journal GUARD/EXPIRED instead of being evaluated
  # (no tokens). Also how the pre-Phase-5 signal.guard backlog drains on
  # first start. Config-values discipline (baseline §14): placeholder,
  # tuned through the A9 channel.
  max_age_minutes: 240

wake:
  # Off-hours the analyst server may be stopped (heavy slot owns the
  # memory). Probe-first wake, same discipline + sudoers rule as A13
  # (/etc/sudoers.d/a13-wake). Wake failure -> ALERT_ONLY, never a stuck
  # queue.
  enabled: true
  probe_timeout_secs: 3
  command: "sudo systemctl start llama-a2.service"
  ready_timeout_secs: 240
  poll_secs: 5
auto_execute:                  # v0.21.0 — gated auto execution (phase 5, rule 12)
  enabled: true                # false = every verdict stays advisory (v0.20 behaviour)
  actions: [exit]              # never tighten_stop yet: no evidence
  urgencies: [high]
  require_watch_hit_or_correction: true
                               # only a verbatim watch-list hit or a correction
                               # of the entry story executes: the subset A11
                               # showed to be right (3 saves, 0 shakeouts).
                               # C4 sells on its next engine pass in session
                               # (exit layer GUARD); off-hours verdicts execute
                               # at the next open. A11 classifies the outcome
                               # like any other verdict; A9 evaluates the
                               # guard_save_rate.
