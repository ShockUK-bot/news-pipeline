# Phase 4 capital + hard limits (phase4-design-v1_0 D2). Percentages/caps are
# GIT-ONLY (baseline rule 25 as amended). Operational controls (kill_switch,
# trading_capital, max_trades_per_day) live in journal.control via dashboard.
#
# v0.4.8: A3 discretion follows the Analyst slot upgrade to Qwen3.6-27B
# (in place on :8081). v0.14.9: model_id corrected to the Qwen3.8-27B the slot
# has actually served since 08-22. ROLLBACK: model_id "qwen3.6-27b-q5_k_m".
capital:
  base_mode: static
  risk_per_trade_pct: 0.005
  max_position_notional_pct: 0.15
  max_portfolio_heat_pct: 0.03
  heat_split: {SHORT: 0.02, LONG: 0.01}
  max_sector_heat_pct: 0.015         # v0.20.1: back to 1.5% (operator 2026-09-17
                                     # evening, after the 0.03 of v0.20.0). Risk
                                     # dollars (shares x stop distance), not
                                     # notional: 1,500 on a 100k account; a 15k
                                     # position with a 1% stop uses ~150 of it.
  sector_heat_mode: net              # v0.20.0: net = |long risk - short risk| in
                                     # the sector, so a pair trade does not double
                                     # count. gross = the v0.19.0 sum.
  min_viable_risk_fraction: 0.5
scanner:                             # v0.12.1 — scanner-origin sizing policy
  risk_multiplier: 1.0               # v0.16.0 (2026-09-17): was 0.5. 17 closed
                                     # scanner trades, 11 winners, +1,378; the
                                     # operator lifted it early. ROLLBACK: 0.5.
  max_position_notional_pct: 0.30    # v0.16.0: lane cap replacing the global
                                     # 15% for scanner entries. The 15% cap bound
                                     # on 15 of 17 trades (2 ATR(5m) on a large
                                     # cap is ~1% of price, so 14.6k notional
                                     # could only carry ~150 dollars of risk).
                                     # Why 30 and not 25: the viability rule
                                     # (min_viable_risk_fraction 0.5) vetoes a
                                     # trade whose clipped risk is under half the
                                     # budget; that threshold is stop >= 0.83% of
                                     # price at 0.15/0.5x (today) and at 0.30/1.0x,
                                     # but 1.0% at 0.25/1.0x, which would have
                                     # vetoed 5 of the 17 trades to date.
                                     # ROLLBACK: delete this line (global cap
                                     # applies again). Restart a3-risk.
  max_concurrent_positions: 2        # open origin=scanner positions (A3 veto)
  sector_clip: false                 # v0.20.0: the scanner lane is NOT clipped by
                                     # sector heat (operator: the one lane that
                                     # works keeps its size); its positions still
                                     # count toward the heat other lanes see.
  sector_cluster:                    # v0.20.0: one scanner position per sector
    mode: shadow                     # shadow = journal SCANNER_SECTOR_CLUSTER in
                                     # the RISK payload and trade anyway; veto =
                                     # A3 vetoes. Shadow first so A11/A9 can say
                                     # what clustered entries actually did.
    max_per_sector: 1
limits:
  max_trades_per_day_default: 5      # control-table override wins if present
  adv_participation_max: 0.01
  spread_max_bps: 40
  entry_blackout_final_min: 15
model:                               # A3 bounded discretion (Analyst slot)
  backend: llamacpp                  # v0.12.22: was "stub" — shipped as the dev
                                     # setting, so bounded discretion NEVER ran on
                                     # the Spark (every trade fell back to profile
                                     # defaults). stub remains valid for dev.
  endpoint: "http://127.0.0.1:8081"
  model_id: "qwen3.8-27b-q5_k_m"
  temperature: 0.0
  max_tokens: 400
  timeout_secs: 60
  retries_on_invalid: 1
  disable_thinking: true       # v0.14.5 — same 27B hybrid-model thinking-leak bug as
                               # A2 (see config/a2.yaml). A3's bounded-discretion
                               # sizing call is JSON; without this it leaks prose,
                               # fails validation, and every trade silently falls
                               # back to profile defaults (the v0.12.22 shape).
