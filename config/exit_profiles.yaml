# Phase 4 exit profiles (phase4-design-v1_0 D6). Practitioner starting points,
# tuned only through the A9 loop.
profiles:
  short_term_v1:
    initial_stop:   {method: atr, k: 2.0}
    catastrophe:    {method: atr, k: 3.5}
    breakeven_at_R: 1.0
    trail:          {activate_at_R: 1.5, method: atr, k: 2.5}
    profit_lock:    {activate_pct: 0.05, trail_pct: 0.04}   # v0.26.2: once up 5%, stop trails 4% behind the high
    promotion_keeps_trail: true    # v0.26.2: a promoted scalp keeps its 1.5 x 5-min ATR trail
                                   # (HOOD 09-18: the daily-ATR trail sat 17 dollars back and never moved)
    time_stop:      {window: thesis, min_progress_R: 0.5}
    realization:    {target_fraction: 0.7, action: scale_out_50}
    earnings_blackout_exit: true
    overnight_hold: eod_rule_v1
  scalp_v1:                            # v0.12.1 — scanner-origin trades ONLY
    initial_stop:   {method: atr_5m, k: 2.0}    # ATR(14) on completed 5-min bars
    catastrophe:    {method: atr_5m, k: 3.5}
    breakeven_at_R: 0.75
    trail:          {activate_at_R: 1.0, method: atr_5m, k: 1.5}
    time_stop:      {window_minutes: 60, min_progress_R: 0.5}
    realization:    {target_fraction: 0.6, action: scale_out_50}
    earnings_blackout_exit: true
    overnight_hold: force_flat         # HARD RULE: C4 market-exits at force_flat_time_et
    force_flat_time_et: "15:50"
  long_term_v1:
    initial_stop:   {method: atr, k: 3.0}
    catastrophe:    {method: atr, k: 4.5}
    breakeven_at_R: 1.0
    trail:          {activate_at_R: 2.0, method: atr_weekly, k: 4.0}
    profit_lock:    {activate_pct: 0.08, trail_pct: 0.05}   # v0.26.0: once up 8%, stop trails 5% behind the high (tighter of this and the R trail)
    time_stop:      null
    realization:    {target_fraction: 0.7, action: review_flag}
    earnings_blackout_exit: false
    overnight_hold: default_hold
  thesis_v1:                           # v0.12.26 — thesis-store-origin trades
    initial_stop:   {method: atr, k: 3.0}
    catastrophe:    {method: atr, k: 4.5}
    breakeven_at_R: 1.0
    trail:          {activate_at_R: 2.0, method: atr_weekly, k: 4.0}
    profit_lock:    {activate_pct: 0.08, trail_pct: 0.05}   # v0.26.0: once up 8%, stop trails 5% behind the high (tighter of this and the R trail)
    time_stop:      null               # the thesis store IS the time stop:
                                       # C11 arms an exit when the thesis
                                       # dies (invalidated/realized/stale)
    realization:    {target_fraction: 0.7, action: review_flag}
    earnings_blackout_exit: false      # operator policy 2026-08-11: hold
                                       # through earnings at half-size;
                                       # C11 journals a trim reco when
                                       # entering earnings with >=0.5R gain
    overnight_hold: default_hold
discretion_bands:
  k: [1.5, 2.5]
  realization_fraction: [0.5, 0.9]
  time_window_sessions: [1, 3]
overnight_rule:                      # D1 thresholds
  check_time_et: "15:45"
  hold_min_unrealized_R: 0.3
  young_max_age_sessions: 1
  young_max_realized_fraction: 0.5

