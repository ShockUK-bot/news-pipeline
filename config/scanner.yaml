# C10 Momentum Scanner (v0.12.1 — design: claude/momentum-scanner-spec-v1_0.md).
# ALL numeric values are PLACEHOLDER starting points from practitioner
# literature, tuned exclusively through the A9 evidence loop (same discipline
# as gate.yaml). The scanner is another INPUT, not a firehose: the caps below
# are the first anti-overtrading layer and zero emissions is a correct day.
scanner:
  scan_interval_secs: 60
  movers_top: 50                 # v0.12.28: was hard-coded 20. The movers
                                 # list is ranked by % change, so 20 slots
                                 # are all >25% microcap spikes on any
                                 # volatile day; 50 reaches past them.
  most_actives_top: 50           # v0.12.17: also scan the top-N most-active
                                 # names. The movers list is ranked
                                 # by % change, so its 20 slots fill with
                                 # >25% microcap spikes and a liquid +7%
                                 # mover (SPCX, 2026-08-06 unlock day) can
                                 # never enter it. 0 disables this leg.
  most_actives_by: [volume, trades]
                                 # v0.12.28: one leg per ranking. 'volume' is
                                 # SHARE count and structurally favours cheap
                                 # stock — WDAY (2026-08-13) did +25% on
                                 # ~$1.8bn and 8.75m shares, the best setup of
                                 # the day, and appeared in NO leg: never
                                 # measured, never journaled, invisible.
                                 # 'trades' ranks by trade count, which is
                                 # price-neutral. Legs are fetched
                                 # independently; a failing leg is skipped,
                                 # not fatal.
  exclude_derivative_shapes: true  # v0.12.28: drop warrants / rights / units /
                                 # preferreds on SYMBOL SHAPE before any
                                 # market-data call (BBBY.WS, DAVEW, AHT.PRD).
                                 # The spec always excluded them; nothing
                                 # enforced it, so on 2026-08-13 they were
                                 # essentially the entire day's scan budget —
                                 # four market-data calls each to reach a
                                 # guaranteed PRICE_FLOOR reject.
  session_start_et: "09:50"      # open blackout (15m) + 5m of settling
  session_end_et: "15:15"        # last emission — room to work before force-flat
  # -- candidate filters (ALL must pass) --------------------------------------
  min_price: 5.0                 # no penny-stock tape games
  min_adv20_dollars: 25000000    # $25M avg daily dollar volume — exits must be liquid
  min_move_pct: 0.04             # >= 4% MAGNITUDE vs prev close = "big
                                 # mover" (v0.13: applies to both directions)
  include_losers: true           # v0.13: also scan top LOSERS — the short
                                 # book's momentum candidates. Gate-kept by
                                 # shorting.lanes.scanner: with the lane off,
                                 # every down candidate vetoes LONG_ONLY at
                                 # C3 (and is measured in counterfactuals).
  min_rel_volume: 3.0            # day volume vs ADV(20) pace at this session time
  max_minutes_since_hod: 60      # move still in progress, not a morning spike flatlining
  max_spread_bps: 40             # mirrors risk.yaml limits.spread_max_bps
  min_luld_headroom_pct: 0.02    # approximated from 5-min tape (see rules.py)
  exclude_etfs: true             # index plumbing, not a story (best-effort name filter)
  etf_denylist: []               # v0.12.14: extra tickers to exclude, e.g. [PTIR, PLTU]
                                 # — the built-in list + the official-name check
                                 # (assets API) usually catch these; this is the
                                 # operator's override for anything that slips.
  earnings_blackout_sessions: 1  # no names reporting today/tonight (leak-shaped traps)
  # -- news cross-check -------------------------------------------------------
  news_strong_window_hours: 4    # escalated news item in this window -> news owns it
  news_weak_window_hours: 24     # any news naming the ticker -> weak match, attach
  news_owns_it_until_veto: true  # v0.12.28: news ownership EXPIRES when C3
                                 # vetoes. WDAY 2026-08-13: the news lane
                                 # escalated at 14:36 and vetoed at 15:05 —
                                 # the scanner would have stood down all the
                                 # way through for a lane that was declining
                                 # the trade, and after the veto no lane
                                 # owned the name at all. false restores the
                                 # v0.12.17 behaviour.
  # -- emission caps (anti-overtrading, layer 1) ------------------------------
  max_per_scan: 2                # top-N by composite score per scan cycle
  max_per_day: 15                # global daily ESCALATION cap (v0.13.8: was 6
                                 # — operator decision 2026-08-20 after the
                                 # 2026-08-19 incident where all 6 were spent
                                 # by 09:54 ET. This caps analyst calls, not
                                 # trades: max_concurrent_positions, the
                                 # breaker and risk.max_trades_per_day are
                                 # unchanged.)
  max_per_hour: 6                # v0.13.8 pacing: EMITTED rows in any rolling
                                 # 60 min. A wild open can no longer spend the
                                 # whole day's budget in three scans (08-19:
                                 # 6/6 gone in 2m47s; MSTR's afternoon move
                                 # had no budget left to compete for). 0 = off.
  min_emit_score: 0.60           # v0.13.8 quality floor: below this a survivor
                                 # journals FILTERED/SCORE_FLOOR and consumes
                                 # NO budget. 08-19: slots 4-6 went to scores
                                 # 0.51-0.55 (AVGO/AXTI/RKLB) in the first
                                 # three scans. Tune from scanner_candidates.
  precheck_short_availability: true
                                 # v0.13.8: a DOWN-mover already through the
                                 # SSR trigger, or not easy-to-borrow at the
                                 # broker (same client+bar as C3's gate check,
                                 # 30-min TTL), journals FILTERED and consumes
                                 # no budget — its veto was knowable before
                                 # spending the slot (08-19: WYFI no-borrow +
                                 # AXTI SSR burned 2 of 6). Cost: filtered
                                 # names also lose the rare long-capitulation
                                 # path; rows are journaled so A9 can judge.
  ssr_trigger_pct: -0.10         # Reg SHO rule 201 (mirrors gate shorting cfg)
  assets_ttl_secs: 1800          # borrow-flag cache TTL (mirrors C3)
  observe_after_cap: true        # v0.13.8: cap reached -> keep scanning and
                                 # JOURNALING (emit nothing). false restores
                                 # the pre-v0.13.8 early return that left the
                                 # scanner blind 09:54-15:15 on 2026-08-19.
  max_concurrent_positions: 2    # open origin=scanner positions (A3 enforces too)
  breaker_max_losses_per_day: 3  # 3 losing scanner trades -> scanner off until tomorrow
