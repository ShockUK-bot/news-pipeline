# C12 burst stream (v0.15.0) — research only, no order path.
# Design and evidence: docs/claude_1pct-gain-design-2026-09-15.md.
# Every number here is a starting point; tune from journal.burst_events.
feed: sip                        # overridden by ALPACA_FEED; falls back to iex
keep_secs: 2700                  # 45 min of 5-second buckets per symbol
detect_interval_secs: 5

universe:
  from_journal: true             # tickers with ADV20 >= min_adv_dollars seen by
  min_adv_dollars: 1000000000    # the scanner or the gate in the last N days
  journal_days: 30
  max_symbols: 400               # hard cap on the subscription
  static:                        # liquid large caps the journal may not have
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AVGO
    - AMD
