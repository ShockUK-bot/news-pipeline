detect:
  session_start_ct: "08:36"      # 6 min warm-up after the 08:30 open
  session_end_ct: "14:55"
  stale_secs: 30                 # no print in 30 s -> skip the symbol
  ret_60s: 0.004                 # |60 s return| >= 0.4% ...
  ret_120s: 0.006                # ... or |120 s return| >= 0.6%
  vol_window_secs: 60
  baseline_secs: 1800            # median 5 s bucket volume over the prior 30 min
  baseline_rth_only: true        # ignore premarket buckets in the baseline
  min_baseline_buckets: 24       # need >= 2 min of RTH history
  vol_mult: 4.0                  # window volume >= 4x baseline pace
  extreme_secs: 1800             # new 30-min high (long) / low (short)
  require_extreme: true
  cooldown_secs: 900             # one event per symbol per 15 min
  news_window_secs: 900          # A1 escalation within 15 min -> news_anchored row
  horizon_secs: 1800             # forward path scored at +30 min
  score_target: 0.01             # first-hit scoring bracket
  score_stop: 0.007
  # v0.15.4: honest scoring. Sessions 1 and 2 put most fade "wins" inside the
  # first minute after detection (the detection print IS the spike), so every
  # event is also scored from the first print entry_delay_secs later with half
  # the quoted spread as crossing cost (detail.realistic). Repeat bursts in a
  # name inside repeat_window_secs and fades of bursts larger than
  # fade_max_burst_pct are flagged (detail.repeat / detail.fade_oversize) and
  # kept out of the report's fade sample; both lost in the measured sessions.
  entry_delay_secs: 30
  repeat_window_secs: 1800
  fade_max_burst_pct: 0.015
