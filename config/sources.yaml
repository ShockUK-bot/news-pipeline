# C1 source registry. Trust tiers per baseline v0.2 (§4 C1):
#   1 = SEC EDGAR / exchange releases
#   2 = established wires
#   3 = aggregated / RSS
# Gap thresholds are per-source "silence means trouble" windows, split by
# market-hours vs off-hours (the firehose being quiet at 3AM Sunday is normal).

alpaca:
  enabled: true
  tier: 2                      # alpaca_benzinga wire content
  gap_threshold_market_secs: 300      # 5 min silent during RTH -> gap
  gap_threshold_offhours_secs: 7200   # 2 h silent off-hours -> gap
  reconnect_base_secs: 1
  reconnect_max_secs: 60

edgar:
  enabled: true
  tier: 1
  poll_interval_secs: 15       # well under SEC 10 req/s fair-access cap
  gap_threshold_market_secs: 900
  gap_threshold_offhours_secs: 14400
  # Event-class forms that enter the pipeline (prefix match: "8-K" admits
  # "8-K/A"). Everything else is stored to news_items as a record but never
  # enqueued (2026-07-14 fix: Form 4 / 424B2 flood was 90%+ of volume).
  triage_forms:
    - "8-K"
    - "6-K"
    - "S-1"
    - "425"
    - "SC 13D"
    - "SC 13G"
    - "SCHEDULE 13D"
    - "SCHEDULE 13G"
    - "10-K"
    - "10-Q"
  # CIK->ticker mapping (v0.4.6): SEC company_tickers.json cached on disk,
  # refreshed daily. skip_unmapped: whitelisted filings whose entities map
  # to no listed ticker are archived without triage (fail-safe: ignored if
  # the map is empty/unfetchable).
  cik_map_path: "/opt/pipeline/var/cik_map.json"
  cik_map_refresh_hours: 24
  skip_unmapped: true
  # current-events Atom feed, 8-K prioritized via channels tag
  feed_url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&count=40&output=atom"
  extra_feeds:
    - name: "all-filings"
      url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=&company=&dateb=&owner=include&count=40&output=atom"

rss:
  enabled: true
  tier: 3
  poll_interval_secs: 60
  gap_threshold_market_secs: 1800
  gap_threshold_offhours_secs: 21600
  # -- v0.13.3 transport settings ----------------------------------------
  # The old code used one flat 20s timeout covering connect AND read, with
  # no retry, so a single slow body from a big wire feed logged an ERROR and
  # painted that feed's row yellow. Split timeouts + one retry + a 3-strike
  # rule fix that. Worst case for a total network outage is
  # feeds x (retries+1) x connect_timeout ~ 5 min, comfortably inside the
  # 1800s market gap threshold above, so the dead-man ladder is unaffected.
  connect_timeout_secs: 10
  read_timeout_secs: 25
  retries: 1                   # extra attempts inside one poll
  retry_base_secs: 1.5
  feed_degrade_after: 3        # consecutive failed polls before the row goes yellow
  aggregate_degrade_after: 2
  feeds:
    # -- PR wires ----------------------------------------------------------
    # v0.13.3: prnewswire's all-news feed (rss/news-releases-list.rss) is
    # GONE — 404 confirmed 2026-08-15 from two independent directions, as is
    # the alternate URL prepared in v0.11.2. Their per-category feeds work,
    # with two traps:
    #   * an UNKNOWN category returns valid RSS with 20 fresh items and an
    #     EMPTY channel <title>. Hence expect_title_prefix on both — without
    #     it we would ingest a fallback feed forever and never see an error.
    #   * most categories are weeks-to-months stale. Of 14 that resolve, only
    #     4 were fresh on 2026-08-15; these are the two relevant to equities.
    #     stale_after_hours makes a feed going quiet visible on its own row.
    #
    # v0.13.6 — THE 120h FLOOR. Every stale_after_hours below was re-derived
    # from measured data after the 72h limits started false-alarming on their
    # first weekend. Two findings from probing all seven GlobeNewswire lanes
    # on 2026-08-16:
    #   1. The binding constraint is MARKET CLOSURE, not publishing volume.
    #      Six of seven lanes had a newest item 49-52h old on a Sunday —
    #      Friday's news, entirely healthy. A three-day holiday weekend plus
    #      one quiet Friday is ~120h of legitimate silence. Any limit under
    #      that alarms on normal quiet, which trains you to ignore the row.
    #   2. These are fixed 20-item windows, so a quiet lane's window spans
    #      days. gnw-ipo's window was 270.9h with a 71.6h max gap BETWEEN
    #      CONSECUTIVE ITEMS — the old 72h limit was a coin flip on that feed.
    # Rule: stale_after_hours = max(120, 2 x measured max inter-item gap).
    # A test enforces the 120h floor.
    #
    # What this check is FOR: "has this source died" (the WSJ feed that
    # returned valid RSS for 19 months while frozen). It is NOT a latency
    # alarm — heartbeat.GapMonitor and the gap thresholds above own "is
    # ingestion broken", and they are unaffected by any of this.
    - name: "prnewswire-financial"
      url: "https://www.prnewswire.com/rss/financial-services-latest-news/financial-services-latest-news-list.rss"
      expect_title_prefix: "All Financial Services"
      require_items: true
      stale_after_hours: 120    # floor: holiday weekend + a quiet day
    - name: "prnewswire-bustech"
      url: "https://www.prnewswire.com/rss/business-technology-latest-news/business-technology-latest-news-list.rss"
      expect_title_prefix: "All Business Technology"
      require_items: true
      stale_after_hours: 120    # floor: holiday weekend + a quiet day
    # v0.13.4 — THE globenewswire ReadTimeout, root cause found 2026-08-15.
    # GlobeNewswire is behind Akamai, and Akamai TARPITS the browser User-Agent
    # v0.11.1 introduced: TLS completes, the request goes out, and the server
    # then sends ZERO bytes until the client gives up. No timeout value fixes
    # that. Probed from the Spark, same URL, same second:
    #     Chrome/124 browser string ....... 0 bytes, timeout
    #     no User-Agent header at all ..... 0 bytes, timeout
    #     curl/8.5.0 ...................... 200, 36772 bytes, 0.19s
    #     python-httpx/0.28.1 ............. 200, 36772 bytes, 0.24s
    #     news-pipeline/... (below) ....... 200, 36772 bytes, 0.16s
    #     Mozilla/5.0 (compatible; news-pipeline/...) 200, 36772 bytes
    # So it is browser IMPERSONATION being refused, not the word "Mozilla" and
    # not bots as such. This is the exact inverse of prnewswire (v0.11.1, which
    # 404s honest bots) and the same shape as BLS (v0.12.25) — three publishers,
    # three incompatible demands, which is why poll_headers does this per feed.
    # The string identifies us honestly and gives their ops a way to reach us
    # instead of silently escalating. It is a STATIC identifier: the version in
    # it does not track releases, and it should only be edited after re-probing.
    # Not personal data, so a literal here is fine (contrast BLS, rule 22).
    - name: "globenewswire-public"
      url: "https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies"
      user_agent: "news-pipeline/0.13.4 (+https://github.com/ShockUK-bot/news-pipeline)"
      require_items: true
      stale_after_hours: 120    # floor: holiday weekend + a quiet day
      read_timeout_secs: 40    # generous, but the real fix is the UA above
    # -- businesswire-all: REMOVED in v0.13.5 -----------------------------
    # The channel is dead and there is no replacement we can reach. Probed
    # 2026-08-15/16 from the Spark:
    #   * feed.businesswire.com answers 200 to EVERY User-Agent tried
    #     (honest, curl, browser, "NewsNow") with the same 951 bytes, whose
    #     own <description> reads: "The RSS channel you requested was
    #     deactivated by the administrator." That token is a saved-channel
    #     id and Business Wire has switched it off.
    #   * www.businesswire.com — needed to discover a replacement URL —
    #     returns 403 to a browser UA and read-times-out on an honest one.
    #     Both doors shut, so no replacement can be found from here.
    #   * feed.businesswire.com/robots.txt Disallows /rss/ for everyone
    #     except two named agents (NewsNow, Tiingo News). We are neither.
    # It had been answering 200 with a valid, parseable, EMPTY feed —
    # silently green on the dashboard — for an unknown length of time. That
    # is exactly what require_items exists to catch, and v0.13.3 shipped it
    # WITHOUT require_items on the one feed already known to be fragile.
    # Hence the consistency rule below, and the test that now enforces it.
    # The wire lane is still covered: GlobeNewswire (8 feeds), PR Newswire
    # (2), Newsfile (1), plus Alpaca's Benzinga stream on tier 2.
    # Newsfile (TMX): dense US small/mid-cap coverage, which is the size band
    # the majors under-serve. 25 items/poll, verified fresh 2026-08-15.
    - name: "newsfile-global"
      url: "https://feeds.newsfilecorp.com/global/Last25Stories"
      require_items: true
      stale_after_hours: 120    # floor: holiday weekend + a quiet day

    # -- GlobeNewswire subject lanes (v0.13.3) -----------------------------
    # Same host we already poll, split by catalyst type so A1 sees the event
    # class without having to infer it. The numeric code is what selects the
    # content; the text after the hyphen and the whole feedTitle segment are
    # cosmetic, so we use "x" — a label containing "/" or "'" (e.g. subject
    # 22, "Insider's Buy/Sell") returns HTTP 400 unless double-encoded.
    # An unknown code does NOT 404 — it returns a valid, EMPTY feed. Hence
    # require_items on every one of these.
    - name: "gnw-earnings"
      url: "https://www.globenewswire.com/RssFeed/subjectcode/13-x/feedTitle/x"
      user_agent: "news-pipeline/0.13.4 (+https://github.com/ShockUK-bot/news-pipeline)"
      tags: ["catalyst", "earnings"]
      require_items: true
      stale_after_hours: 120    # 2x measured max gap 1.2h, floor 120h
    - name: "gnw-manda"
      url: "https://www.globenewswire.com/RssFeed/subjectcode/27-x/feedTitle/x"
      user_agent: "news-pipeline/0.13.4 (+https://github.com/ShockUK-bot/news-pipeline)"
      tags: ["catalyst", "m-and-a"]
      require_items: true
      stale_after_hours: 120    # 2x measured max gap 5.5h, floor 120h
    - name: "gnw-ipo"
      url: "https://www.globenewswire.com/RssFeed/subjectcode/21-x/feedTitle/x"
      user_agent: "news-pipeline/0.13.4 (+https://github.com/ShockUK-bot/news-pipeline)"
      tags: ["catalyst", "ipo", "offering"]
      require_items: true
      stale_after_hours: 168    # 2x measured max gap 71.6h, floor 120h
    - name: "gnw-clinical"
      url: "https://www.globenewswire.com/RssFeed/subjectcode/90-x/feedTitle/x"
      user_agent: "news-pipeline/0.13.4 (+https://github.com/ShockUK-bot/news-pipeline)"
      tags: ["catalyst", "clinical", "biotech"]
      require_items: true
      stale_after_hours: 120    # 2x measured max gap 59h, floor 120h
    - name: "gnw-insider"
      url: "https://www.globenewswire.com/RssFeed/subjectcode/22-x/feedTitle/x"
      user_agent: "news-pipeline/0.13.4 (+https://github.com/ShockUK-bot/news-pipeline)"
      tags: ["catalyst", "insider"]
      require_items: true
      stale_after_hours: 120    # 2x measured max gap 41.7h, floor 120h
    - name: "gnw-classaction"
      url: "https://www.globenewswire.com/RssFeed/subjectcode/84-x/feedTitle/x"
      user_agent: "news-pipeline/0.13.4 (+https://github.com/ShockUK-bot/news-pipeline)"
      tags: ["catalyst", "litigation"]
      require_items: true
      stale_after_hours: 120    # 2x measured max gap 1.4h, floor 120h
    - name: "gnw-management"
      url: "https://www.globenewswire.com/RssFeed/subjectcode/86-x/feedTitle/x"
      user_agent: "news-pipeline/0.13.4 (+https://github.com/ShockUK-bot/news-pipeline)"
      tags: ["catalyst", "management-change"]
      require_items: true
      stale_after_hours: 120    # 2x measured max gap 15.2h, floor 120h

    # -- Exchange market structure (v0.13.3) -------------------------------
    # Nasdaq UTP trading halts. Tier 1: this is the exchange itself, not an
    # aggregator, and it covers halts on ALL US venues, not just Nasdaq
    # listings. A T1 (news pending) halt IS the event, minutes before any
    # wire carries the release.
    # Needs adapter=nasdaq_halts: the items have no <guid> and no <link>
    # (normalize_rss would quarantine every one), the <title> is the bare
    # ticker, and everything real is in an ndaq: namespace. The adapter
    # synthesises a stable guid and a readable headline, and lifts
    # <ndaq:IssueSymbol> into symbols — a publisher-provided field, not
    # inference. NOTE: http, not https; the currenthalts and news variants
    # of this feed are both retired (404).
    - name: "nasdaq-halts"
      url: "http://www.nasdaqtrader.com/rss.aspx?feed=tradehalts"
      tier: 1
      tags: ["halt", "market-structure"]
      adapter: "nasdaq_halts"
      symbol_fields: ["ndaq_issuesymbol"]
      # deliberately no require_items: a genuinely halt-free session is
      # normal and must not look like a broken feed.
      # deliberately no stale_after_hours: quiet is the good outcome here.

    # -- macro/economy lane (v0.12.24) --------------------------------------
    # Official primary sources carry their own tier (per-feed override; the
    # block default of 3 still applies to the wire feeds above). `tags` are
    # injected into the item's channels so A1 triage and A5 can see the
    # source class. These items are ticker-less by nature: material ones
    # route to signal.thesis via router rule 3 — never the intraday path.
    # v0.13.5 consistency rule: EVERY feed carries require_items, because a
    # 200 OK with nothing in it is the failure mode that hid businesswire's
    # death. The single exception is nasdaq-halts, where an empty response
    # genuinely means "nothing is halted" — the good outcome. A test pins
    # that exception list at exactly one name.
    # stale_after_hours is applied wherever a publishing CADENCE exists to
    # measure against. fed-monetary is deliberately left without one: FOMC
    # statements are weeks apart by design, and a limit there would alarm on
    # normal quiet rather than on a fault.
    - name: "fed-monetary"
      url: "https://www.federalreserve.gov/feeds/press_monetary.xml"
      tier: 1
      tags: ["macro", "fed", "monetary-policy"]
      require_items: true
    # v0.12.25: BLS corrected. The v0.12.24 URL (feed/news_release.rss)
    # does not exist (404), and BLS 403s the browser-impersonating UA the
    # PR wires require — probe-proven: it admits ONLY clients identifying
    # themselves with contact info. bls_latest.rss is BLS's all-releases
    # wire (jobs report, CPI, PPI, ECI, import prices — one entry per
    # release as published). The UA string contains an email address, so
    # it lives in /etc/pipeline/pipeline.env as BLS_USER_AGENT (rule 22 —
    # this file is public), read per-feed by rss.py's poll_headers. If the
    # env var is missing the feed degrades VISIBLY on its own health row;
    # nothing else is affected.
    - name: "bls-latest"
      url: "https://www.bls.gov/feed/bls_latest.rss"
      tier: 1
      tags: ["macro", "econ-data"]
      user_agent_env: "BLS_USER_AGENT"
      require_items: true
      stale_after_hours: 168   # near-daily; a week of silence is a fault
    - name: "eia-today"
      url: "https://www.eia.gov/rss/todayinenergy.xml"
      tier: 2
      tags: ["macro", "energy"]
      require_items: true
      stale_after_hours: 168   # daily on weekdays; ditto
