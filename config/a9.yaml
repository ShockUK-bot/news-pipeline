# A9 weekend review (v0.18.0). Code finds the evidence and writes the proposal;
# the model only narrates; the operator approves by telling Claude Code.
review:
  evidence_weeks: 4            # window for lanes, guard, vetoes, burst
  max_proposals: 3             # one change each; the rest go to the watch list
  narrative: true              # heavy slot explains each proposal (ships without)
narrative:
  max_tokens: 900
  temperature: 0.0
  timeout_secs: 600
  retries_on_invalid: 1
heavy:                         # same slot discipline as A7 (Saturday morning is off-hours)
  endpoint: "http://127.0.0.1:8084"
  model_id: "qwen3.5-122b-a10b-q4_k_m"
  disable_thinking: true
  autostart: true
  stop_after_use: true
  start_command: "sudo systemctl start llama-heavy.service"
  stop_command: "sudo systemctl stop llama-heavy.service"
  probe_timeout_secs: 5
  ready_timeout_secs: 420
  poll_secs: 10
analyst_fallback:
  enabled: true
  endpoint: "http://127.0.0.1:8081"
  model_id: "qwen3.8-27b-q5_k_m"
  wake:
    enabled: true
    command: "sudo systemctl start llama-a2.service"
    probe_timeout_secs: 3
    ready_timeout_secs: 240
    poll_secs: 5
